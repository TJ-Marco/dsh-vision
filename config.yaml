# dsh-vision 运行配置
# 所有路径支持环境变量覆盖，优先级：环境变量 > 本文件 > 内置默认值。

server:
  host: 0.0.0.0            # 监听地址（局域网部署需 0.0.0.0）
  port: 8000
  max_upload_mb: 64        # 上传体积上限（文件/视频）

models:
  cache_dir: null          # 模型缓存目录；null = ~/.cache/dsh-vision；可用环境变量 DSH_VISION_CACHE 覆盖
  device: auto             # auto | cuda | cpu（auto = 有 CUDA 用 GPU，否则 CPU）
  manifest: models.json    # 模型清单文件（源/SHA256/许可）
  auto_download: true      # 首次调用时自动下载缺失权重（false 则仅提示，需手动运行 download_models.py）
  enabled:                 # 各识别任务开关（false 时该任务在 API 中不可用）
    object_detection: true
    captioning: true
    scene: true
    ocr: true
    faces: false           # 人脸识别默认关闭：涉生物特征数据与模型商用许可，公司合规一般建议禁用
  confidence:
    default: 0.35          # 全局置信度阈值；API 请求可逐次覆盖

ocr:
  engine: paddle           # paddle | easy（easy 需先安装 requirements-ocr-easy.txt）
  langs: ["ch", "en"]      # 识别语言（按引擎支持配置）
  use_angle_cls: true      # PaddleOCR 方向分类器

video:
  default_fps: 1.0         # 目标采样帧率（帧/秒）
  max_frames: 120          # 抽帧上限（防御长视频）
  strategy: uniform        # uniform | scene（scene = 场景切换帧）
  scene_threshold: 30.0    # scene 策略：帧间 HSV 直方图卡方距离阈值
  workers: 4               # 并行抽帧识别的工作线程数（每线程独立模型实例）

logging:
  level: INFO              # DEBUG | INFO | WARNING | ERROR
