name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 版本固定与本地验证环境一致：
          #   - ruff 0.5.x：已提交代码按该版本格式化
          #   - fastapi <0.141：0.141+ 新增 annotated-doc 依赖，本仓库未引入
          # 测试使用假模型（见 tests/conftest.py），无需 torch/ultralytics 等重型依赖。
          pip install "fastapi>=0.111,<0.141" "uvicorn[standard]" pydantic pydantic-settings \
            python-multipart httpx numpy opencv-python-headless pillow pyyaml \
            pytest "ruff>=0.5.7,<0.6"

      - name: Lint with ruff
        run: ruff check app scripts tests examples

      - name: Format check with ruff
        run: ruff format app scripts tests examples --check

      - name: Run tests with pytest
        env:
          # 测试不联网：关闭自动下载权重
          DSH_VISION_AUTO_DOWNLOAD: "false"
        run: pytest tests -v
