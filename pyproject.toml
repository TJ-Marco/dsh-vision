# dsh-vision 项目配置：ruff（PEP8 自查）与 pytest（Phase 3 单测）
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/W = pycodestyle 基础规范；F = pyflakes 未用/未定义；I = isort 导入顺序
# B = bugbear 常见缺陷；UP = pyupgrade 现代语法；SIM = 简化写法
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
# 行长度上限由 line-length 控制，代码格式化交给 ruff format
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
